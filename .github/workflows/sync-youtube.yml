name: Sync YouTube videos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync YouTube RSS feed
        run: node scripts/sync-youtube.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/data/youtube.ts; then
            echo "No YouTube changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/youtube.ts
          git commit -m "Sync YouTube videos [skip netlify]"
          git push